<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My GitHub Website</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Georgia, "Times New Roman", serif;
            background: #10110f;
            color: #f0eee7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 46%, rgb(91 86 66 / 18%), transparent 48%),
                #10110f;
        }

        main {
            display: grid;
            justify-items: center;
            gap: 2rem;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            max-width: 20ch;
            margin: 0;
            font-size: clamp(2rem, 7vw, 5rem);
            font-weight: 400;
            line-height: 1.08;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: 1px solid #d5c99d;
            border-radius: 2px;
            background: transparent;
            color: #f0eee7;
            font: 600 0.9rem/1.2 system-ui, sans-serif;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 180ms ease, color 180ms ease, border-color 650ms ease;
        }

        button:hover,
        button:focus-visible {
            background: #d5c99d;
            color: #10110f;
        }

        button:focus-visible {
            outline: 2px solid #f0eee7;
            outline-offset: 4px;
        }

        .char {
            display: inline-block;
            white-space: pre;
            will-change: transform, opacity, filter;
        }

        .vanishing .char {
            animation: dissolve 1.15s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
            animation-delay: var(--delay);
        }

        .vanishing button {
            border-color: transparent;
        }

        #result {
            display: none;
            justify-items: center;
            gap: 2rem;
            padding: 2rem;
            text-align: center;
        }

        #result h1 {
            display: grid;
            place-items: center;
            font-size: clamp(4rem, 16vw, 12rem);
        }

        body.complete #intro {
            display: none;
        }

        body.complete #result {
            display: grid;
            animation: reveal 900ms ease both;
        }

        @keyframes reveal {
            from {
            opacity: 0;
            transform: translateY(0.15em);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes dissolve {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: translate(0, 0) rotate(0) scale(1);
            }
            100% {
                opacity: 0;
                filter: blur(7px);
                transform: translate(var(--x), var(--y)) rotate(var(--rotate)) scale(0.15);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main id="intro">
        <button id="dismiss" type="button">Click me</button>
    </main>
    <main id="result" aria-live="polite">
        <h1>Hello</h1>
        <button id="back" type="button">Go back</button>
    </main>

    <script>
        const intro = document.querySelector("#intro");
        const button = document.querySelector("#dismiss");
        const back = document.querySelector("#back");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        const characters = [...button.textContent].map((character, index) => {
            const x = `${(Math.random() - 0.5) * 260}px`;
            const y = `${-40 - Math.random() * 180}px`;
            const rotate = `${(Math.random() - 0.5) * 100}deg`;
            const delay = `${Math.random() * 0.45 + index * 0.008}s`;
            const span = document.createElement("span");
            span.className = "char";
            span.style.setProperty("--x", x);
            span.style.setProperty("--y", y);
            span.style.setProperty("--rotate", rotate);
            span.style.setProperty("--delay", delay);
            span.textContent = character;
            return span;
        });
        button.replaceChildren(...characters);

        button.addEventListener("click", () => {
            if (intro.classList.contains("vanishing")) return;
            intro.classList.add("vanishing");

            window.setTimeout(() => {
                document.body.classList.add("complete");
            }, reducedMotion.matches ? 50 : 2000);
        });

        back.addEventListener("click", () => {
            document.body.classList.remove("complete");
            intro.classList.remove("vanishing");
        });
    </script>
</body>
</html>
